<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>Claudex Monitor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="deck" class="deck" aria-label="Claude and Codex usage">
    <header class="top">
      <span id="led" class="led" role="status"></span>
      <span class="name">Claudex Monitor</span>
      <button id="refresh-now" class="ctl" type="button" aria-label="Refresh now" title="Refresh now">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 3v3.5H10M2.5 13V9.5H6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.6 6a4.8 4.8 0 0 1 9-1.2l.9 1.7M12.4 10a4.8 4.8 0 0 1-9 1.2l-.9-1.7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <button id="pin" class="ctl" type="button" aria-pressed="true" aria-label="Always on top" title="Always on top">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 1.5h4l-.7 4 2.7 2.7V10H4V8.2l2.7-2.7zM8 10v4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>
    <section class="provider claude" id="claude" aria-label="Claude usage">
      <div class="provider-head"><h2>Claude</h2><span class="plan"></span><span class="status"></span></div>
      <div class="rows"></div>
    </section>
    <section class="provider codex" id="codex" aria-label="Codex usage">
      <div class="provider-head"><h2>Codex</h2><span class="plan"></span><span class="status"></span></div>
      <div class="rows"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
